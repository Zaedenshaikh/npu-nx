name: Android Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - uses: actions/checkout@v4
      with:
        repository: Zaedenshaikh/nxformat-packer
        path: packer

    - name: Install Android SDK command-line tools
      run: |
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        cd "$ANDROID_HOME/cmdline-tools"
        curl -L -s -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        unzip -q -o cmdline-tools.zip -d latest
        mv latest/cmdline-tools latest/tools
        rm cmdline-tools.zip
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

    - name: Install Android SDK packages
      run: |
        YES | "$ANDROID_HOME/cmdline-tools/latest/tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "platform-tools" "build-tools;34.0.0" "platforms;android-34" >/dev/null 2>&1 || true

    - name: Install NDK
      run: |
        YES | "$ANDROID_HOME/cmdline-tools/latest/tools/bin/sdkmanager" --sdk_root="$ANDROID_HOME" "ndk;27.0.12077973" >/dev/null 2>&1 || true

    - name: Install Rust toolchain with Android target
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android

    - name: Configure Rust linker for Android
      run: |
        NDK_DIR="$ANDROID_HOME/ndk/27.0.12077973"
        echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
        NDK_CLANG="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"
        NDK_AR="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
        ls -la "$NDK_CLANG" "$NDK_AR"
        mkdir -p cli/.cargo
        printf '[target.aarch64-linux-android]\nlinker = "%s"\nar = "%s"\n' "$NDK_CLANG" "$NDK_AR" > cli/.cargo/config.toml
        echo "CC_aarch64_linux_android=$NDK_CLANG" >> $GITHUB_ENV
        echo "AR_aarch64_linux_android=$NDK_AR" >> $GITHUB_ENV
        echo "CFLAGS_aarch64_linux_android=-target aarch64-linux-android34" >> $GITHUB_ENV

    - name: Build Rust CLI for Android
      working-directory: ./cli
      run: cargo build --release --target aarch64-linux-android

    - name: Copy Rust binary to Android assets
      run: |
        mkdir -p app/src/main/assets
        cp cli/target/aarch64-linux-android/release/nxconvert app/src/main/assets/nxconvert

    - name: Make gradlew executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: nxconvert-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
